services:
  - type: web
    runtime: static
    name: gtf-tropilha-crioula-site
    buildCommand: "pip install -q pillow; python3 tools/fotos_para_monday.py || true"
    staticPublishPath: .
    autoDeployTrigger: commit
    envVars:
      - fromGroup: gtf-monday
    routes:
      - type: redirect
        source: /programas.html
        destination: /projetos-culturais.html
      - type: redirect
        source: /curso-de-fandango.html
        destination: /projetos-culturais.html
      - type: redirect
        source: /invernadas-artisticas.html
        destination: /projetos-culturais.html
      - type: redirect
        source: /galeto-solidario.html
        destination: /projetos-sociais.html
      - type: redirect
        source: /tropilanche.html
        destination: /projetos-sociais.html
      - type: redirect
        source: /natal-solidario.html
        destination: /projetos-sociais.html
      - type: redirect
        source: /eventos.html
        destination: /eventos-e-competicoes.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data:; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
      - path: /*.css
        name: Cache-Control
        value: public, max-age=86400
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=604800
      - path: /*.png
        name: Cache-Control
        value: public, max-age=604800
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=2592000
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
